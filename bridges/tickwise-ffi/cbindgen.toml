# cbindgen configuration for the tickwise-ffi C header.
#
# Regenerate with, from the repository root:
#   cbindgen --config bridges/tickwise-ffi/cbindgen.toml --crate tickwise-ffi --output bridges/tickwise-ffi/include/tickwise.h
# CI regenerates the header and fails when the checked-in copy drifts.

language = "C"
cpp_compat = true
include_guard = "TICKWISE_FFI_H"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
usize_is_size_t = true
documentation = true
documentation_style = "c99"
style = "both"
line_length = 100
tab_width = 4

header = """/* tickwise-ffi: the C ABI over the Tickwise core.
 *
 * Generated by cbindgen from bridges/tickwise-ffi. Do not edit by hand.
 * Licensed under MIT OR Apache-2.0, at your option.
 */"""

[export]
prefix = ""
exclude = ["VERSION_CSTR"]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[fn]
args = "vertical"

[parse]
parse_deps = false
