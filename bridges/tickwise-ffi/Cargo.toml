[package]
name = "tickwise-ffi"
description = "C ABI over the Tickwise core for engine bridges: Unity, Unreal, cocos2d-x"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cosgunhalil/Tickwise"
publish = false

[lib]
# cdylib for P/Invoke and dlopen consumers, staticlib for iOS and static
# linking into engine plugins, rlib so the crate's own Rust tests can
# call the exported functions directly.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tickwise = { path = "../../crates/tickwise" }
# The same xxh3 the core's serde layer uses under hash_algo_id 1, exposed
# so engine users hash with the same algorithm as Rust users.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
# Finds the system C compiler, including MSVC without a developer shell,
# so the C harness under ctest/ builds inside cargo test on every platform.
cc = "1"

# The release profile is what ships inside engine packages, so it trades
# build time for size and speed. Panics stay unwinding on purpose: the
# boundary guard turns them into status codes, and panic = "abort" would
# take the whole game process down instead.
[profile.release]
lto = true
codegen-units = 1

[workspace]
