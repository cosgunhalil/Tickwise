name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, and tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with warnings as errors
        run: cargo clippy --all-targets -- -D warnings

      - name: Lint with every feature enabled
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests with default features
        run: cargo test

      - name: Run tests with every feature enabled
        run: cargo test --all-features

      - name: Build documentation with warnings denied
        run: cargo doc --workspace --lib --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: build on the minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the declared minimum toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check every target with every feature on the minimum version
        run: cargo check --workspace --all-targets --all-features

  integrations:
    name: ggrs ex_game integration on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/ggrs-ex-game

      - name: Check formatting
        run: cargo fmt --manifest-path integrations/ggrs-ex-game/Cargo.toml --all --check

      - name: Lint with warnings as errors
        run: cargo clippy --manifest-path integrations/ggrs-ex-game/Cargo.toml --all-targets -- -D warnings

      - name: Run the integration tests
        run: cargo test --manifest-path integrations/ggrs-ex-game/Cargo.toml

      - name: Check the bones ecs integration
        run: |
          cargo fmt --manifest-path integrations/bones-ecs/Cargo.toml --all --check
          cargo clippy --manifest-path integrations/bones-ecs/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path integrations/bones-ecs/Cargo.toml

  ffi:
    name: tickwise-ffi on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Cargo reads the crate's .cargo/config.toml, which links the C
        # runtime statically on Windows, only from the working directory.
        working-directory: bridges/tickwise-ffi
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridges/tickwise-ffi

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with warnings as errors
        run: cargo clippy --all-targets -- -D warnings

      - name: Run the tests, including the C harness
        run: cargo test

      - name: Read the C harness recordings with the CLI
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          CTEST=bridges/tickwise-ffi/target/debug/ctest
          cargo run -q -p tickwise-cli -- inspect "$CTEST/clean.rec"
          set +e
          cargo run -q -p tickwise-cli -- compare "$CTEST/clean.rec" "$CTEST/chaotic.rec" | tee compare.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1 || { echo "::error::compare exited with $code, expected 1"; exit 1; }
          grep -q "421" compare.log
          # Both recordings carry dumps every 100 ticks: field level with no replay.
          set +e
          cargo run -q -p tickwise-cli -- diff "$CTEST/clean.rec" "$CTEST/chaotic.rec" --at 500 | tee diff.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1 || { echo "::error::diff exited with $code, expected 1"; exit 1; }
          grep -q "score" diff.log
          # The .dump the C replay wrote agrees with the recording at the shared tick.
          cargo run -q -p tickwise-cli -- diff "$CTEST/clean.dump" "$CTEST/clean.rec"

      - name: Build the shared and static libraries
        run: cargo build --release

      - name: Check that the Windows DLL does not need the VC++ redistributable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /DEPENDENTS target/release/tickwise_ffi.dll
          Write-Host ($deps -join "`n")
          if ($deps -match "VCRUNTIME|api-ms-win-crt") {
            Write-Error "tickwise_ffi.dll imports the dynamic C runtime; .cargo/config.toml did not apply"
            exit 1
          }

      - name: Build documentation with warnings denied
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Install cbindgen
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cbindgen

      - name: Check that the committed C header matches the source
        if: matrix.os == 'ubuntu-latest'
        run: |
          cbindgen --config cbindgen.toml --crate tickwise-ffi --output /tmp/tickwise.h .
          if ! diff -u include/tickwise.h /tmp/tickwise.h; then
            echo "::error::include/tickwise.h is out of date, regenerate it with the command in cbindgen.toml"
            exit 1
          fi

  cpp:
    name: tickwise-cpp on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bridges/tickwise-ffi

      - name: Build the native library
        working-directory: bridges/tickwise-ffi
        run: cargo build --release

      - name: Configure the C++ layer
        run: cmake -S bridges/tickwise-cpp -B bridges/tickwise-cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build the harness with warnings as errors
        run: cmake --build bridges/tickwise-cpp/build --config Release

      - name: Run the harness
        run: ctest --test-dir bridges/tickwise-cpp/build -C Release --output-on-failure

      - name: Read the harness recordings with the CLI
        shell: bash
        run: |
          set -o pipefail
          REC=bridges/tickwise-cpp/build/recordings
          cargo run -q -p tickwise-cli -- inspect "$REC/clean.rec"
          set +e
          cargo run -q -p tickwise-cli -- compare "$REC/clean.rec" "$REC/chaotic.rec" | tee compare.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1 || { echo "::error::compare exited with $code, expected 1"; exit 1; }
          grep -q "tick 421" compare.log
          set +e
          cargo run -q -p tickwise-cli -- diff "$REC/clean.rec" "$REC/chaotic.rec" --at 500 | tee diff.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1 || { echo "::error::diff exited with $code, expected 1"; exit 1; }
          grep -q "score" diff.log
          cargo run -q -p tickwise-cli -- diff "$REC/clean.dump" "$REC/clean.rec"

  cocos2dx:
    name: tickwise-cocos2dx on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bridges/tickwise-ffi

      - name: Build the native library
        working-directory: bridges/tickwise-ffi
        run: cargo build --release

      - name: Configure the adapter against the shim
        run: cmake -S bridges/tickwise-cocos2dx -B bridges/tickwise-cocos2dx/build -DCMAKE_BUILD_TYPE=Release

      - name: Build with warnings as errors
        run: cmake --build bridges/tickwise-cocos2dx/build --config Release

      - name: Run the harness
        run: ctest --test-dir bridges/tickwise-cocos2dx/build -C Release --output-on-failure

      - name: Read the harness recordings with the CLI
        shell: bash
        run: |
          set -o pipefail
          REC=bridges/tickwise-cocos2dx/build/recordings
          cargo run -q -p tickwise-cli -- inspect "$REC/clean.rec"
          set +e
          cargo run -q -p tickwise-cli -- compare "$REC/clean.rec" "$REC/chaotic.rec" | tee compare.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1 || { echo "::error::compare exited with $code, expected 1"; exit 1; }
          grep -q "tick 421" compare.log
          # The node dumped on demand at the planted tick, so the diff lands on it.
          set +e
          cargo run -q -p tickwise-cli -- diff "$REC/clean.rec" "$REC/chaotic.rec" --at 421 | tee diff.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1 || { echo "::error::diff exited with $code, expected 1"; exit 1; }
          grep -q "score" diff.log

  unreal-plugin:
    name: unreal plugin layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the descriptor, module layout, and that no build output is tracked
        run: bash bridges/tickwise-unreal/scripts/check-plugin.sh

  godot:
    name: tickwise-godot on ubuntu-latest
    runs-on: ubuntu-latest
    env:
      # gdext 0.5 targets this API version, so the tests run against the
      # engine the bindings were generated from.
      GODOT_VERSION: 4.6-stable
    defaults:
      run:
        working-directory: bridges/tickwise-godot
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridges/tickwise-godot

      - name: Install Godot
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          name="Godot_v${GODOT_VERSION}_linux.x86_64"
          curl -sSLo godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${name}.zip"
          unzip -q godot.zip
          chmod +x "$name"
          "./$name" --headless --version
          echo "GODOT_BIN=${{ runner.temp }}/$name" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with warnings as errors
        run: cargo clippy --all-targets -- -D warnings

      - name: Run the tests, including the headless Godot project
        # Without this the integration test skips itself when no engine is
        # present, which is right on a contributor's machine and wrong here.
        env:
          TICKWISE_REQUIRE_GODOT: "1"
        run: cargo test

      - name: Build documentation with warnings denied
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check that the crate is publishable
        run: cargo package --no-verify --allow-dirty

  bevy:
    name: tickwise-bevy on ubuntu-latest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridges/tickwise-bevy
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridges/tickwise-bevy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with warnings as errors
        run: cargo clippy --all-targets -- -D warnings

      - name: Run the headless tests
        run: cargo test

      - name: Build documentation with warnings denied
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check that the crate is publishable
        run: cargo package --no-verify --allow-dirty

  unity-package:
    name: unity package layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check package.json and the .meta files
        run: bash bridges/unity/scripts/check-package.sh

  unity-wrapper:
    name: unity wrapper tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bridges/tickwise-ffi

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the native library
        working-directory: bridges/tickwise-ffi
        run: cargo build --release

      - name: Build the tickwise CLI the tests shell out to
        run: cargo build -p tickwise-cli

      - name: Run the wrapper tests against the native library
        run: dotnet test bridges/unity/Tickwise.Tests --logger "console;verbosity=normal"

  fuzz-smoke:
    name: fuzz the reader and the pair comparators for 60 seconds each
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Seed the corpora with valid recordings
        run: |
          mkdir -p fuzz/corpus/rec_reader fuzz/corpus/compare_pairs
          cargo run -p tickwise-refsim --example record_demo -- fuzz/corpus/rec_reader/seed.rec --dump-every 600
          cargo run -p tickwise-refsim --example record_demo -- /tmp/chaotic.rec --chaos float-drift --dump-every 600
          # The pair target reads a u32 split point, then both files back to back.
          python3 - <<'EOF'
          import struct
          a = open('fuzz/corpus/rec_reader/seed.rec', 'rb').read()
          b = open('/tmp/chaotic.rec', 'rb').read()
          with open('fuzz/corpus/compare_pairs/seed.bin', 'wb') as out:
              out.write(struct.pack('<I', len(a)) + a + b)
          EOF

      - name: Run the fuzzers
        run: |
          set -o pipefail
          cargo fuzz run rec_reader --target x86_64-unknown-linux-gnu -- -max_total_time=60 2>&1 | tee fuzz-output.log
          cargo fuzz run compare_pairs --target x86_64-unknown-linux-gnu -- -max_total_time=60 2>&1 | tee -a fuzz-output.log

      - name: Summarize the failure
        if: failure()
        run: |
          echo '## Fuzz failure' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 fuzz-output.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: |
            fuzz/artifacts/
            fuzz-output.log
          if-no-files-found: ignore
