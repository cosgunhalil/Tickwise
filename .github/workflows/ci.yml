name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, and tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with warnings as errors
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  fuzz-smoke:
    name: fuzz the .rec reader for 60 seconds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Seed the corpus with a valid recording
        run: |
          mkdir -p fuzz/corpus/rec_reader
          cargo run -p tickwise-refsim --example record_demo -- fuzz/corpus/rec_reader/seed.rec

      - name: Run the fuzzer
        run: |
          set -o pipefail
          cargo fuzz run rec_reader --target x86_64-unknown-linux-gnu -- -max_total_time=60 2>&1 | tee fuzz-output.log

      - name: Summarize the failure
        if: failure()
        run: |
          echo '## Fuzz failure' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 fuzz-output.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: |
            fuzz/artifacts/
            fuzz-output.log
          if-no-files-found: ignore
